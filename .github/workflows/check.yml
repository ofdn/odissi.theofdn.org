name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # the build needs real ids; this copy is thrown away, the ids that count come on merge
      - run: npm run mint-new
      - run: npm run build
